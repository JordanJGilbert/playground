<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#70c5ce">
<title>Hi Lao Lao — Jordan loves u the mostest toastest</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #70c5ce;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Logical resolution (classic Flappy Bird is 288x512)
  const W = 288;
  const H = 512;
  canvas.width = W;
  canvas.height = H;

  function resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / W, vh / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // --- Game constants (easy mode for Lao Lao) ---
  const GRAVITY = 0.22;
  const FLAP = -5.2;
  const MAX_FALL = 7;
  const PIPE_SPEED = 1.1;
  const PIPE_SPACING = 200;       // horizontal distance between pipes
  const PIPE_GAP = 170;           // vertical gap
  const PIPE_WIDTH = 52;
  const GROUND_HEIGHT = 112;
  const BIRD_X = 70;
  const BIRD_W = 34;
  const BIRD_H = 24;

  // --- State ---
  const STATE = { READY: 0, PLAYING: 1, DEAD: 2 };
  let state = STATE.READY;
  let bird, pipes, score, best, groundOffset, flashAlpha, deathTimer;
  best = parseInt(localStorage.getItem('flappy_best') || '0', 10);

  function reset() {
    bird = { x: BIRD_X, y: H / 2 - 40, vy: 0, rot: 0, wing: 0, wingT: 0, alive: true };
    pipes = [];
    score = 0;
    groundOffset = 0;
    flashAlpha = 0;
    deathTimer = 0;
    spawnInitialPipes();
  }

  function spawnInitialPipes() {
    let x = W + 80;
    for (let i = 0; i < 4; i++) {
      pipes.push(makePipe(x));
      x += PIPE_SPACING;
    }
  }

  function makePipe(x) {
    const minTop = 40;
    const maxTop = H - GROUND_HEIGHT - PIPE_GAP - 40;
    const top = minTop + Math.random() * (maxTop - minTop);
    return { x, top, passed: false };
  }

  function flap() {
    if (state === STATE.READY) {
      state = STATE.PLAYING;
      bird.vy = FLAP;
    } else if (state === STATE.PLAYING) {
      bird.vy = FLAP;
      bird.wingT = 0;
    } else if (state === STATE.DEAD && deathTimer > 45) {
      reset();
      state = STATE.READY;
    }
  }

  // --- Input ---
  function onTap(e) {
    e.preventDefault();
    flap();
  }
  canvas.addEventListener('pointerdown', onTap);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      flap();
    }
  });

  // --- Collision ---
  function hitsPipe(b, p) {
    const bx = b.x + 8, by = b.y + 7;
    const bw = BIRD_W - 16, bh = BIRD_H - 14;
    if (bx + bw < p.x || bx > p.x + PIPE_WIDTH) return false;
    if (by < p.top) return true;
    if (by + bh > p.top + PIPE_GAP) return true;
    return false;
  }

  // --- Drawing helpers ---
  function drawBackground() {
    // Sky gradient
    const g = ctx.createLinearGradient(0, 0, 0, H - GROUND_HEIGHT);
    g.addColorStop(0, '#4ec0ca');
    g.addColorStop(1, '#70c5ce');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);

    // Distant clouds
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    drawCloud(40, 90, 30);
    drawCloud(160, 60, 22);
    drawCloud(240, 120, 26);

    // Buildings (dark silhouette)
    ctx.fillStyle = '#3a8b85';
    const skyBase = H - GROUND_HEIGHT - 60;
    for (let i = 0; i < 8; i++) {
      const x = (i * 42 - (groundOffset * 0.3) % 42) - 20;
      ctx.fillRect(x, skyBase, 28, 30);
      ctx.fillRect(x + 6, skyBase - 14, 16, 14);
    }

    // Bushes
    ctx.fillStyle = '#5ee270';
    const bushY = H - GROUND_HEIGHT - 20;
    for (let i = 0; i < 10; i++) {
      const x = (i * 34 - (groundOffset * 0.6) % 34) - 20;
      ctx.beginPath();
      ctx.arc(x + 8, bushY + 10, 12, 0, Math.PI * 2);
      ctx.arc(x + 20, bushY + 8, 14, 0, Math.PI * 2);
      ctx.arc(x + 30, bushY + 12, 10, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#4bbf5e';
    ctx.fillRect(0, bushY + 16, W, 6);
  }

  function drawCloud(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.arc(x + r * 0.8, y + 4, r * 0.8, 0, Math.PI * 2);
    ctx.arc(x - r * 0.8, y + 4, r * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGround() {
    // Dirt layer
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);

    // Top grass stripes
    ctx.fillStyle = '#a3d660';
    ctx.fillRect(0, H - GROUND_HEIGHT, W, 12);
    ctx.fillStyle = '#82bd4d';
    ctx.fillRect(0, H - GROUND_HEIGHT + 12, W, 4);

    // Moving stripe pattern
    ctx.fillStyle = '#d1c56f';
    const stripeY = H - GROUND_HEIGHT + 20;
    for (let i = -1; i < W / 16 + 1; i++) {
      const x = i * 16 - (groundOffset % 16);
      ctx.fillRect(x, stripeY, 8, 6);
    }

    // Bottom stripe
    ctx.fillStyle = '#c0b85f';
    ctx.fillRect(0, H - 16, W, 16);
  }

  function drawPipe(p) {
    const bottomY = p.top + PIPE_GAP;
    const bottomH = H - GROUND_HEIGHT - bottomY;

    // Top pipe body
    pipeBody(p.x, 0, PIPE_WIDTH, p.top - 26);
    pipeCap(p.x - 2, p.top - 26, PIPE_WIDTH + 4, 26);

    // Bottom pipe body
    pipeCap(p.x - 2, bottomY, PIPE_WIDTH + 4, 26);
    pipeBody(p.x, bottomY + 26, PIPE_WIDTH, bottomH - 26);
  }

  function pipeBody(x, y, w, h) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#5eb042');
    g.addColorStop(0.3, '#a7dc70');
    g.addColorStop(0.5, '#c9e97f');
    g.addColorStop(0.7, '#a7dc70');
    g.addColorStop(1, '#3b7a28');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#2a5a1c';
    ctx.fillRect(x + w - 2, y, 2, h);
    ctx.fillStyle = '#1e3f13';
    ctx.fillRect(x, y, 2, h);
  }

  function pipeCap(x, y, w, h) {
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#5eb042');
    g.addColorStop(0.3, '#b4e07a');
    g.addColorStop(0.5, '#d3ee85');
    g.addColorStop(0.7, '#b4e07a');
    g.addColorStop(1, '#3b7a28');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#2a5a1c';
    ctx.fillRect(x, y + h - 3, w, 3);
    ctx.fillStyle = '#1e3f13';
    ctx.fillRect(x, y, w, 2);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x + BIRD_W / 2, bird.y + BIRD_H / 2);
    ctx.rotate(bird.rot);

    // Body
    ctx.fillStyle = '#f7d51d';
    roundRect(-BIRD_W / 2, -BIRD_H / 2, BIRD_W, BIRD_H, 10);
    ctx.fill();

    // Belly
    ctx.fillStyle = '#fff5b1';
    ctx.beginPath();
    ctx.ellipse(-2, 4, 11, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wing (animates)
    const wingPhase = Math.sin(bird.wing) * 4;
    ctx.fillStyle = '#e8a83a';
    ctx.beginPath();
    ctx.ellipse(-4, 2 + wingPhase * 0.3, 8, 5 + Math.abs(wingPhase) * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c9872a';
    ctx.beginPath();
    ctx.ellipse(-4, 2 + wingPhase * 0.3, 8, 5 + Math.abs(wingPhase) * 0.3, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Eye white
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(8, -4, 5, 0, Math.PI * 2);
    ctx.fill();
    // Pupil
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(10, -4, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#f38b25';
    ctx.beginPath();
    ctx.moveTo(14, -2);
    ctx.lineTo(22, 0);
    ctx.lineTo(14, 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#d86a10';
    ctx.beginPath();
    ctx.moveTo(14, 2);
    ctx.lineTo(22, 0);
    ctx.lineTo(14, 4);
    ctx.closePath();
    ctx.fill();

    // Outline
    ctx.strokeStyle = '#3a2a0a';
    ctx.lineWidth = 1.2;
    roundRect(-BIRD_W / 2, -BIRD_H / 2, BIRD_W, BIRD_H, 10);
    ctx.stroke();

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawScore() {
    if (state === STATE.PLAYING || state === STATE.DEAD) {
      drawBigNumber(score, W / 2, 60);
    }
  }

  function drawBigNumber(n, cx, cy) {
    const s = String(n);
    ctx.font = 'bold 36px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#3a2a0a';
    ctx.fillStyle = '#fff';
    ctx.strokeText(s, cx, cy);
    ctx.fillText(s, cx, cy);
  }

  function drawReady() {
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#3a2a0a';
    ctx.lineWidth = 3;

    // Love note to Lao Lao (rainbow, pulsing)
    const pulse = 1 + Math.sin(performance.now() / 350) * 0.06;
    ctx.save();
    ctx.translate(W / 2, 70);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = '#ff5ea8';
    ctx.font = 'bold 22px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.strokeText('Hi Lao Lao!', 0, 0);
    ctx.fillText('Hi Lao Lao!', 0, 0);
    ctx.restore();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.strokeText('Jordan loves u the', W / 2, 100);
    ctx.fillText('Jordan loves u the', W / 2, 100);
    ctx.fillStyle = '#ffd166';
    ctx.strokeText('mostest toastest', W / 2, 120);
    ctx.fillText('mostest toastest', W / 2, 120);

    // Floating hearts
    const ht = performance.now() / 600;
    ctx.font = 'bold 18px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillStyle = '#ff3b6b';
    ctx.strokeStyle = '#3a2a0a';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const hx = 60 + i * 80 + Math.sin(ht + i) * 10;
      const hy = 150 + Math.cos(ht * 1.3 + i * 2) * 6;
      ctx.strokeText('❤', hx, hy);
      ctx.fillText('❤', hx, hy);
    }

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#3a2a0a';
    ctx.lineWidth = 3;
    ctx.font = 'bold 22px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.strokeText('Get Ready', W / 2, 195);
    ctx.fillText('Get Ready', W / 2, 195);

    ctx.font = 'bold 14px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.strokeText('Tap to flap', W / 2, 225);
    ctx.fillText('Tap to flap', W / 2, 225);

    // Pulsing hand/arrow hint
    const t = performance.now() / 400;
    const ox = Math.sin(t) * 3;
    ctx.font = 'bold 32px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.strokeText('👆', W / 2 + ox, 265);
    ctx.fillText('👆', W / 2 + ox, 265);
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);

    // Panel
    const pw = 200, ph = 150;
    const px = (W - pw) / 2, py = 130;
    ctx.fillStyle = '#ded895';
    roundRect(px, py, pw, ph, 8);
    ctx.fill();
    ctx.strokeStyle = '#3a2a0a';
    ctx.lineWidth = 2;
    roundRect(px, py, pw, ph, 8);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#d94b3a';
    ctx.strokeStyle = '#3a2a0a';
    ctx.lineWidth = 3;
    ctx.font = 'bold 24px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.strokeText('Game Over', W / 2, py + 30);
    ctx.fillText('Game Over', W / 2, py + 30);

    ctx.font = 'bold 14px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillStyle = '#3a2a0a';
    ctx.strokeStyle = 'transparent';
    ctx.fillText('Score', px + 60, py + 70);
    ctx.fillText('Best', px + 140, py + 70);

    ctx.font = 'bold 22px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#3a2a0a';
    ctx.lineWidth = 3;
    ctx.strokeText(String(score), px + 60, py + 98);
    ctx.fillText(String(score), px + 60, py + 98);
    ctx.strokeText(String(best), px + 140, py + 98);
    ctx.fillText(String(best), px + 140, py + 98);

    if (deathTimer > 45) {
      const a = 0.5 + 0.5 * Math.sin(performance.now() / 300);
      ctx.globalAlpha = a;
      ctx.font = 'bold 14px -apple-system, Segoe UI, Roboto, sans-serif';
      ctx.fillStyle = '#fff';
      ctx.strokeText('Tap to retry', W / 2, py + ph + 22);
      ctx.fillText('Tap to retry', W / 2, py + ph + 22);
      ctx.globalAlpha = 1;
    }
  }

  // --- Update loop ---
  let lastT = performance.now();
  function loop(t) {
    const dt = Math.min((t - lastT) / (1000 / 60), 2.5);
    lastT = t;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    bird.wing += 0.35 * dt;

    if (state === STATE.READY) {
      // Idle bob
      bird.y = H / 2 - 40 + Math.sin(performance.now() / 250) * 5;
      bird.rot = 0;
      groundOffset += PIPE_SPEED * dt;
      return;
    }

    if (state === STATE.PLAYING) {
      bird.vy += GRAVITY * dt;
      if (bird.vy > MAX_FALL) bird.vy = MAX_FALL;
      bird.y += bird.vy * dt;

      // Rotation: nose up on flap, dive on fall
      const target = bird.vy < 0 ? -0.5 : Math.min(Math.PI / 2, bird.vy / 10);
      bird.rot += (target - bird.rot) * 0.12 * dt;

      // Move pipes
      for (const p of pipes) p.x -= PIPE_SPEED * dt;
      // Recycle
      while (pipes.length && pipes[0].x + PIPE_WIDTH < -20) pipes.shift();
      if (pipes.length < 5) {
        const lastX = pipes.length ? pipes[pipes.length - 1].x : W;
        pipes.push(makePipe(lastX + PIPE_SPACING));
      }

      // Scoring
      for (const p of pipes) {
        if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
          p.passed = true;
          score++;
        }
      }

      groundOffset += PIPE_SPEED * dt;

      // Collisions
      if (bird.y + BIRD_H >= H - GROUND_HEIGHT) {
        bird.y = H - GROUND_HEIGHT - BIRD_H;
        die();
      }
      if (bird.y < -8) {
        bird.y = -8;
      }
      for (const p of pipes) {
        if (hitsPipe(bird, p)) { die(); break; }
      }
    }

    if (state === STATE.DEAD) {
      deathTimer += dt;
      bird.vy += GRAVITY * 1.2 * dt;
      if (bird.vy > MAX_FALL) bird.vy = MAX_FALL;
      bird.y += bird.vy * dt;
      bird.rot += 0.15 * dt;
      if (bird.rot > Math.PI / 2) bird.rot = Math.PI / 2;
      if (bird.y + BIRD_H >= H - GROUND_HEIGHT) {
        bird.y = H - GROUND_HEIGHT - BIRD_H;
        bird.vy = 0;
      }
      flashAlpha *= Math.pow(0.85, dt);
    }
  }

  function die() {
    if (state !== STATE.PLAYING) return;
    state = STATE.DEAD;
    deathTimer = 0;
    bird.vy = -3;
    flashAlpha = 0.9;
    if (score > best) {
      best = score;
      localStorage.setItem('flappy_best', String(best));
    }
  }

  function render() {
    drawBackground();
    for (const p of pipes) drawPipe(p);
    drawGround();
    drawBird();

    if (state === STATE.READY) drawReady();
    drawScore();
    if (state === STATE.DEAD) drawGameOver();

    if (flashAlpha > 0.01) {
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
